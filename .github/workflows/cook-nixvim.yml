name: cook-nixvim CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: cook-nixvim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm64
            # 以下macOS架构可选
            # - system: x86_64-darwin
            #   os: macos-latest
            # - system: aarch64-darwin
            #   os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cook-nixvim
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build cook-nixvim
        run: nix build .#packages.${{ matrix.system }}.cook-nixvim -L
      - name: Push nix paths to Cachix
        run: cachix push cook-nixvim $(nix path-info .#packages.${{ matrix.system }}.cook-nixvim)
