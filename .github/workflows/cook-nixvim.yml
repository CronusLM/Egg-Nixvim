name: cook-nixvim CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Cachix auth
        uses: cachix/cachix-action@v15
        with:
          name: cook-nixvim
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build cook-nixvim
        run: nix build .#cook-nixvim -L
      - name: Flake checks
        run: nix flake check -L
      - name: Push nix paths to Cachix
        run: cachix push cook-nixvim $(nix path-info .#cook-nixvim)
